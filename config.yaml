model:
  vocab_size: 8000
  n_layer: 6
  n_head: 6
  n_embd: 384
  block_size: 256
  dropout: 0.1
  bias: false

pretrain:
  batch_size: 32
  grad_accum_steps: 4
  max_iters: 6000
  eval_interval: 250
  eval_iters: 50
  learning_rate: 3.0e-4
  min_lr: 3.0e-5
  warmup_iters: 300
  lr_decay_iters: 6000
  weight_decay: 0.1
  grad_clip: 1.0
  beta1: 0.9
  beta2: 0.95

sft:
  batch_size: 16
  grad_accum_steps: 4
  max_iters: 800
  eval_interval: 50
  weight_decay: 0.05
  grad_clip: 1.0
  learning_rate: 5.0e-5

system:
  device: cuda
  dtype: float16
  seed: 1337
  compile: false

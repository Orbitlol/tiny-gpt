model:
  vocab_size: 2000
  n_layer: 4
  n_head: 4
  n_embd: 256
  block_size: 64
  dropout: 0.1
  bias: false

pretrain:
  batch_size: 4
  grad_accum_steps: 2
  max_iters: 300
  eval_interval: 50
  eval_iters: 5
  learning_rate: 3.0e-4
  min_lr: 3.0e-5
  warmup_iters: 30
  lr_decay_iters: 300
  weight_decay: 0.1
  grad_clip: 1.0
  beta1: 0.9
  beta2: 0.95

sft:
  batch_size: 2
  grad_accum_steps: 2
  max_iters: 100
  eval_interval: 25
  weight_decay: 0.05
  grad_clip: 1.0
  learning_rate: 5.0e-5

system:
  device: cuda
  dtype: float16
  seed: 1337
  compile: false
